<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARRMY CUP 2026 · Losowanie par</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#000; --bg1:#0a0a0a; --slab:#141414; --slab2:#1c1c1c;
  --gold:#fbbf00; --gold2:#daa707; --gold-soft:rgba(251,191,0,.14);
  --neon:#f2f2f2; --neon2:#bdbdbd; --neon-soft:rgba(255,255,255,.08);
  --glass:rgba(18,18,18,.78); --glass2:rgba(28,28,28,.78); --glass-b:rgba(255,255,255,.09);
  --text:#f5f5f5; --muted:#8c8c8c; --danger:#ff5a5a;
  --radius:16px;
  --display:'Rajdhani','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000}
html,body{min-height:100%}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);background:#000;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* tło w stylu baneru: ukośne płaszczyzny i cienkie żółte linie */
.bg-deco{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

.app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,32px) clamp(14px,3vw,32px) 32px}
.glass{background:linear-gradient(160deg,var(--glass2),var(--glass));border:1px solid var(--glass-b);border-radius:var(--radius);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.03em;line-height:1;text-transform:uppercase}
.hidden{display:none!important}

.btn{appearance:none;border:0;cursor:pointer;font:700 15px/1 Inter,sans-serif;color:var(--text);padding:14px 20px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s, box-shadow .2s, background .2s, opacity .2s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-neon{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn-neon:hover{background:var(--gold-soft);box-shadow:0 0 22px rgba(251,191,0,.25)}
.btn-gold{color:#000;background:var(--gold);border:2px solid #000;box-shadow:0 0 0 1px var(--gold),0 10px 30px rgba(251,191,0,.22);
  font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.btn-gold:hover{background:#ffcb1f;box-shadow:0 0 0 1px var(--gold),0 12px 40px rgba(251,191,0,.4)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}

.mute{position:fixed;top:14px;right:14px;z-index:50;width:46px;height:46px;border-radius:50%;padding:0}
.mute svg{width:22px;height:22px}

.brand-logo{display:block;filter:drop-shadow(0 10px 40px rgba(251,191,0,.22))}

/* ---------- konfiguracja ---------- */
.hero{display:flex;justify-content:center;margin:4px 0 26px}
.hero .brand-logo{width:clamp(170px,22vw,250px);height:auto}

.meta-row{padding:16px 18px;margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:14px;flex:1;min-width:240px}
.field label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.input,select.input{width:100%;font:500 16px/1.2 Inter,sans-serif;color:var(--text);background:#0a0a0a;border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:13px 14px;outline:none;transition:border-color .2s, box-shadow .2s}
select.input{appearance:none;max-width:280px;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select.input option{background:#111}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(251,191,0,.15)}
.input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,90,90,.15)}

.pots{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pot-card{padding:22px}
.pot-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.pot-head h2{font-size:32px}
.badge{font:800 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:7px 10px;border-radius:6px;white-space:nowrap}
.badge.gold{color:#000;background:var(--gold)}
.badge.blue{color:var(--text);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
.pot-card.gold-c{border-color:rgba(251,191,0,.35)}
.pot-card.gold-c h2{color:var(--gold)}
.team-input{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.team-input .num{flex:0 0 34px;height:34px;border-radius:8px;display:grid;place-items:center;font:700 20px/1 var(--display)}
.gold-c .num{color:#000;background:var(--gold)}
.blue-c .num{color:#000;background:#e6e6e6}

.setup-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:22px}
.setup-actions .left{display:flex;gap:10px;flex-wrap:wrap}
.error-msg{color:var(--danger);font-size:14px;min-height:20px;margin-top:12px;text-align:center}

/* ---------- losowanie ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 20px;padding-right:62px}
.topbar .brand-logo{width:clamp(96px,11vw,130px);height:auto}
.topbar .right{display:flex;align-items:center;gap:10px}
.topbar .btn{padding:10px 14px;font-size:13px}

.stage-grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:22px;align-items:start}
.machine-col{display:flex;flex-direction:column;gap:18px}

.machine{padding:22px 18px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
.machine::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 55%,rgba(251,191,0,.06) 55%,rgba(251,191,0,.06) 56%,transparent 56%);pointer-events:none}
.target-label{text-align:center;position:relative;z-index:1}
.target-label .k{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:700}
.target-label .v{font:700 28px/1.05 var(--display);color:var(--gold);margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.orb{position:relative;width:min(300px,72vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;z-index:1}
.orb .ring{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 6%,var(--gold) 16%,transparent 28%,transparent 44%,#fff 52%,transparent 60%,transparent 72%,var(--gold2) 84%,transparent 96%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  animation:spin 9s linear infinite;filter:drop-shadow(0 0 8px rgba(251,191,0,.6))}
.orb .ring2{position:absolute;inset:12px;border-radius:50%;border:1px dashed rgba(251,191,0,.22);animation:spin 30s linear infinite reverse}
.orb.spinning .ring{animation-duration:.7s}
.orb.spinning .ring2{animation-duration:3s}
@keyframes spin{to{transform:rotate(360deg)}}
.orb .core{position:absolute;inset:22px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.1),transparent 34%),radial-gradient(circle at 50% 60%,#1d1d1d,#000 72%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.9),inset 0 -10px 30px rgba(251,191,0,.14),0 0 50px rgba(251,191,0,.14)}
.orb .core img{position:absolute;left:50%;top:50%;width:78%;height:auto;transform:translate(-50%,-50%);opacity:.14;transition:opacity .4s}
.orb.spinning .core img{opacity:.06}
.reel{position:relative;z-index:2;width:80%;text-align:center;font:700 34px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:#fff;
  text-shadow:0 0 16px rgba(255,255,255,.35);word-break:break-word;min-height:1em}
.reel.idle{color:rgba(251,191,0,.35);text-shadow:none;font-size:80px}
.reel.tick{animation:reelTick .12s ease-out}
@keyframes reelTick{from{transform:translateY(-35%);opacity:.2;filter:blur(2px)}to{transform:none;opacity:1;filter:none}}
.reel.final{color:var(--gold);text-shadow:0 0 22px rgba(251,191,0,.8),0 0 60px rgba(251,191,0,.4);animation:reelFinal .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes reelFinal{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.orb.hit{animation:orbHit .5s ease}
@keyframes orbHit{25%{transform:scale(1.06)}50%{transform:scale(.98)}}

.btn-draw{width:100%;padding:20px 18px;font-size:22px;border-radius:14px;position:relative;overflow:hidden}
.btn-draw::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
.btn-draw[disabled]::before{display:none}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
.progress-line{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:6px;border-radius:2px;background:rgba(255,255,255,.12);transform:skewX(-20deg);transition:background .4s, box-shadow .4s}
.dots i.on{background:var(--gold);box-shadow:0 0 10px rgba(251,191,0,.5)}

.pool{padding:18px}
.pool h3,.bracket h3{font-size:24px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{position:relative;padding:12px;border-radius:10px;background:#0c0c0c;border:1px solid rgba(255,255,255,.16);font-weight:600;font-size:14px;transition:all .5s ease;overflow:hidden;word-break:break-word}
.chip small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;font-weight:700}
.chip.flicker{animation:chipFlick .12s ease}
@keyframes chipFlick{50%{background:rgba(251,191,0,.2);border-color:var(--gold);box-shadow:0 0 16px rgba(251,191,0,.4)}}
.chip.drawn{opacity:.32;filter:grayscale(1);background:transparent;border-color:rgba(255,255,255,.08);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.4)}
.chip.drawn small{color:var(--muted)}

.bracket{padding:20px}
.pairs{display:flex;flex-direction:column;gap:14px}
.pair{position:relative;border-radius:12px;padding:14px 16px 16px;background:#080808;border:1px solid rgba(255,255,255,.07);transition:border-color .3s, box-shadow .3s}
.pair .pno{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.pair .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.team{min-height:60px;border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;position:relative;overflow:hidden}
.team small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.team .nm{font:700 clamp(20px,2.3vw,28px)/1.02 var(--display);letter-spacing:.03em;text-transform:uppercase;word-break:break-word}
.team.seed{background:var(--gold);color:#000;border:2px solid #000;box-shadow:0 0 0 1px var(--gold)}
.team.seed small{color:rgba(0,0,0,.6)}
.team.slot{border:1.5px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.02);text-align:right;align-items:flex-end}
.team.slot small{color:var(--muted)}
.team.slot .nm{color:rgba(255,255,255,.22)}
.team.slot.filled{border:1.5px solid rgba(255,255,255,.75);background:linear-gradient(225deg,#262626,#111)}
.team.slot.filled small{color:var(--gold)}
.team.slot.filled .nm{color:#fff}
.vs{font:700 20px/1 var(--display);color:var(--muted);width:44px;height:44px;border-radius:8px;display:grid;place-items:center;transform:rotate(45deg);
  background:#111;border:1px solid rgba(255,255,255,.12)}
.vs span{transform:rotate(-45deg)}
.pair.active{border-color:rgba(251,191,0,.6);box-shadow:0 0 0 1px rgba(251,191,0,.2),0 0 30px rgba(251,191,0,.14)}
.pair.active .team.slot{animation:slotPulse 1.2s ease-in-out infinite}
@keyframes slotPulse{50%{border-color:var(--gold);box-shadow:inset 0 0 22px rgba(251,191,0,.18)}}
.pair.done .vs{color:#000;background:var(--gold);border-color:var(--gold)}
.pair.hit{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.team.slot.reveal .nm{animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(2.2);opacity:0;filter:blur(6px)}55%{transform:scale(.92);opacity:1;filter:none}100%{transform:scale(1)}}
.team.slot.reveal::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(251,191,0,.7) 50%,transparent 80%);transform:translateX(-120%);animation:flashSweep .8s ease-out forwards}
@keyframes flashSweep{to{transform:translateX(120%)}}

.finale{padding:22px;text-align:center;border-color:rgba(251,191,0,.5);background:linear-gradient(160deg,rgba(251,191,0,.12),rgba(18,18,18,.85))}
.finale h2{font-size:clamp(32px,4vw,46px);color:var(--gold)}
.finale p{color:var(--muted);margin:8px 0 16px;font-size:14px}
.finale .acts{display:flex;flex-direction:column;gap:10px}
.finale.show{animation:rise .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}

#flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;
  background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),rgba(255,236,170,.85),rgba(251,191,0,.25) 25%,transparent 60%)}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{12%{opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}

.kbd-hint{font-size:12px;color:var(--muted);text-align:center}
.kbd-hint kbd{font:600 11px Inter,sans-serif;padding:2px 6px;border-radius:6px;border:1px solid var(--glass-b);background:rgba(255,255,255,.06)}

.sponsors{display:flex;justify-content:center;margin-top:34px}
.sponsors .pill{padding:14px 34px;border-radius:16px;border:1px solid rgba(251,191,0,.55);background:rgba(10,10,10,.85)}
.sponsors img{display:block;height:28px;width:auto}

@media (max-width:920px){
  .stage-grid{display:flex;flex-direction:column;align-items:stretch}
  .stage-grid > *{min-width:0}
  .bracket h3,.pool h3{flex-wrap:wrap}
  .machine-col{display:contents}
  .machine{order:1}.btn-draw{order:2}.progress-line{order:3}.finale{order:4}.bracket{order:5}.pool{order:6}
  .kbd-hint{display:none}
}
@media (max-width:720px){
  .pots{grid-template-columns:1fr}
  .setup-actions{flex-direction:column-reverse;align-items:stretch}
  .setup-actions .left{justify-content:center}
  .setup-actions .btn{width:100%}
  .field{flex-direction:column;align-items:stretch;gap:8px}
  select.input{max-width:none}
}
@media (max-width:520px){
  .pair .row{grid-template-columns:1fr;gap:10px}
  .team.slot{text-align:left;align-items:flex-start}
  .vs{width:32px;height:32px;font-size:16px;justify-self:center}
  .topbar #backBtn span{display:none}
  .chips{grid-template-columns:1fr}
  .sponsors .pill{padding:12px 20px}.sponsors img{height:22px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<svg class="bg-deco" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><linearGradient id="sl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1e1e"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient></defs>
  <polygon points="980,0 1600,0 1600,900 640,900" fill="url(#sl)" opacity=".75"/>
  <polygon points="0,560 520,330 300,900 0,900" fill="#111"/>
  <polygon points="1180,0 1420,0 900,900 660,900" fill="#161616" opacity=".55"/>
  <polyline points="0,250 260,60" stroke="#fbbf00" stroke-width="1.6" fill="none" opacity=".75"/>
  <polyline points="0,300 300,80 220,240" stroke="#fbbf00" stroke-width="1" fill="none" opacity=".35"/>
  <polyline points="1340,900 1600,560" stroke="#fbbf00" stroke-width="1.6" fill="none" opacity=".75"/>
  <polyline points="1160,860 1600,780" stroke="#fbbf00" stroke-width="1.6" fill="none" opacity=".6"/>
  <polyline points="1600,150 1460,330" stroke="#fbbf00" stroke-width="1" fill="none" opacity=".35"/>
</svg>

<button class="btn btn-ghost mute" id="muteBtn" aria-label="Wycisz dźwięk" title="Wycisz / włącz dźwięk"></button>
<div id="flash"></div>
<canvas id="fx"></canvas>

<div class="app">

<script>
(function(){
'use strict';

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ================== LOSOWOŚĆ (Fisher–Yates + crypto) ================== */
function randInt(n){
  if (window.crypto && crypto.getRandomValues){
    const a = new Uint32Array(1), limit = Math.floor(0x100000000 / n) * n;
    let x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= limit);
    return x % n;
  }
  return Math.floor(Math.random() * n);
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ================== DŹWIĘK (Web Audio API) ================== */
const Sound = {
  ctx:null, master:null, muted: !!store.get('losowanie.muted'),
  init(){
    if (!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : .85;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  setMuted(m){
    this.muted = m; store.set('losowanie.muted', m);
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : .85, this.ctx.currentTime, .03);
  },
  tick(p){ // p: 0..1 postęp losowania – tykanie narasta
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = 'triangle'; o.frequency.setValueAtTime(700 + p * 1100, t);
    f.type = 'highpass'; f.frequency.value = 500;
    const peak = .07 + .2 * p;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + .004);
    g.gain.exponentialRampToValueAtTime(.0001, t + .07);
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + .09);
  },
  gong(big){
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + .01;
    // niskie uderzenie
    const k = c.createOscillator(), kg = c.createGain();
    k.type = 'sine'; k.frequency.setValueAtTime(140, t); k.frequency.exponentialRampToValueAtTime(42, t + .35);
    kg.gain.setValueAtTime(.0001, t); kg.gain.exponentialRampToValueAtTime(.9, t + .01); kg.gain.exponentialRampToValueAtTime(.0001, t + .6);
    k.connect(kg); kg.connect(this.master); k.start(t); k.stop(t + .65);
    // uroczysty akord (C-dur, niskie rejestry) z lekkim rozstrojeniem
    const notes = big ? [65.41, 98, 130.81, 164.81, 196, 261.63, 329.63] : [65.41, 98, 130.81, 164.81, 196];
    const dur = big ? 5 : 3.6;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(500, t + dur);
    lp.connect(this.master);
    notes.forEach((fr, i)=>{
      [0, 4].forEach(det=>{
        const o = c.createOscillator(), g = c.createGain();
        o.type = det ? 'triangle' : 'sine';
        o.frequency.value = fr; o.detune.value = det ? 6 : -3;
        const st = t + (big ? i * .07 : i * .012);
        const lvl = (det ? .05 : .11) * (1 - i * .08);
        g.gain.setValueAtTime(.0001, st);
        g.gain.exponentialRampToValueAtTime(lvl, st + .03);
        g.gain.exponentialRampToValueAtTime(.0001, st + dur);
        o.connect(g); g.connect(lp); o.start(st); o.stop(st + dur + .1);
      });
    });
    // metaliczny połysk (szum)
    const len = c.sampleRate * .8, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const n = c.createBufferSource(), nf = c.createBiquadFilter(), ng = c.createGain();
    n.buffer = buf; nf.type = 'bandpass'; nf.frequency.value = 5200; nf.Q.value = .8; ng.gain.value = .12;
    n.connect(nf); nf.connect(ng); ng.connect(this.master); n.start(t);
  }
};

const muteBtn = document.getElementById('muteBtn');
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';
function renderMute(){
  muteBtn.innerHTML = Sound.muted ? ICON_OFF : ICON_ON;
  muteBtn.setAttribute('aria-label', Sound.muted ? 'Włącz dźwięk' : 'Wycisz dźwięk');
  muteBtn.style.color = Sound.muted ? 'var(--muted)' : 'var(--gold)';
}
muteBtn.addEventListener('click', ()=>{ Sound.init(); Sound.setMuted(!Sound.muted); renderMute(); });
renderMute();

/* ================== KONFETTI ================== */
const FX = (function(){
  const cv = document.getElementById('fx'), cx = cv.getContext('2d');
  let parts = [], running = false, dpr = 1;
  function resize(){ dpr = Math.min(window.devicePixelRatio || 1, 2); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener('resize', resize); resize();
  const COLORS = ['#fbbf00','#ffd84d','#daa707','#ffffff','#e6e6e6','#fbbf00','#9a9a9a'];
  function burst(x, y, count, power){
    for (let i = 0; i < count; i++){
      const a = Math.random() * Math.PI * 2, s = (Math.random() * .8 + .35) * power;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - power * .45,
        w: 4 + Math.random() * 6, h: 6 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
        c: COLORS[(Math.random() * COLORS.length) | 0], life: 0, max: 90 + Math.random() * 70, spark: Math.random() < .25 });
    }
    if (!running){ running = true; requestAnimationFrame(loop); }
  }
  function loop(){
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
    for (const p of parts){
      p.life++; p.vy += .22; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      const al = Math.max(0, 1 - p.life / p.max);
      cx.save(); cx.globalAlpha = al; cx.translate(p.x, p.y);
      if (p.spark){ cx.fillStyle = p.c; cx.shadowColor = p.c; cx.shadowBlur = 10; cx.beginPath(); cx.arc(0,0,2.2,0,Math.PI*2); cx.fill(); }
      else { cx.rotate(p.r); cx.scale(1, Math.cos(p.life * .18)); cx.fillStyle = p.c; cx.fillRect(-p.w/2, -p.h/2, p.w, p.h); }
      cx.restore();
    }
    if (parts.length) requestAnimationFrame(loop); else { running = false; cx.clearRect(0,0,innerWidth,innerHeight); }
  }
  return { burst };
})();

function flashAt(x, y){
  const f = document.getElementById('flash');
  f.style.setProperty('--fx', x + 'px'); f.style.setProperty('--fy', y + 'px');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}

/* ================== KONFIGURACJA ================== */
const EXAMPLES = ['Husaria Esports','Gryfy Gdańsk','Żubry Białystok','Smoki Kraków','Wilki Wrocław','Sokoły Poznań',
  'Rysie Łódź','Niedźwiedzie Lublin','Orły Rzeszów','Kruki Szczecin','Pantery Katowice','Jastrzębie Opole',
  'Lwy Bydgoszcz','Tygrysy Toruń','Rekiny Gdynia','Feniks Kielce'];

const seedBox = document.getElementById('seedInputs'), unseedBox = document.getElementById('unseedInputs');
function makeInputs(box, prefix){
  for (let i = 0; i < 4; i++){
    const row = document.createElement('div'); row.className = 'team-input';
    row.innerHTML = '<span class="num">' + (i + 1) + '</span><input class="input" maxlength="32" id="' + prefix + i + '" placeholder="' +
      (prefix === 's' ? 'Drużyna rozstawiona ' : 'Drużyna nierozstawiona ') + (i + 1) + '" aria-label="' +
      (prefix === 's' ? 'Koszyk 1, drużyna ' : 'Koszyk 2, drużyna ') + (i + 1) + '">';
    box.appendChild(row);
  }
}
makeInputs(seedBox, 's'); makeInputs(unseedBox, 'u');
const sIn = [0,1,2,3].map(i => document.getElementById('s' + i));
const uIn = [0,1,2,3].map(i => document.getElementById('u' + i));
const tStage = document.getElementById('tStage');
const setupErr = document.getElementById('setupErr');

const saved = store.get('losowanie.cfg');
if (saved){
  (saved.seeds || []).forEach((v,i)=>{ if (sIn[i]) sIn[i].value = v; });
  (saved.unseeded || []).forEach((v,i)=>{ if (uIn[i]) uIn[i].value = v; });
  if (saved.stage) tStage.value = saved.stage;
}

document.getElementById('fillBtn').addEventListener('click', ()=>{
  const names = shuffle(EXAMPLES).slice(0, 8);
  sIn.forEach((el,i)=> el.value = names[i]);
  uIn.forEach((el,i)=> el.value = names[i + 4]);
  clearErrors();
});
document.getElementById('clearBtn').addEventListener('click', ()=>{ [...sIn, ...uIn].forEach(el => el.value = ''); clearErrors(); sIn[0].focus(); });
[...sIn, ...uIn].forEach(el => el.addEventListener('input', ()=> el.classList.remove('err')));

function clearErrors(){ setupErr.textContent = ''; [...sIn, ...uIn].forEach(el => el.classList.remove('err')); }

document.getElementById('startBtn').addEventListener('click', ()=>{
  clearErrors();
  const all = [...sIn, ...uIn];
  const empty = all.filter(el => !el.value.trim());
  if (empty.length){ empty.forEach(el => el.classList.add('err')); setupErr.textContent = 'Uzupełnij nazwy wszystkich 8 drużyn (albo kliknij „Wypełnij przykładowymi”).'; empty[0].focus(); return; }
  const seen = {}, dups = [];
  all.forEach(el => { const k = el.value.trim().toLowerCase(); if (seen[k]) { dups.push(el, seen[k]); } else seen[k] = el; });
  if (dups.length){ dups.forEach(el => el.classList.add('err')); setupErr.textContent = 'Nazwy drużyn muszą być unikalne.'; return; }
  const cfg = { seeds: sIn.map(e => e.value.trim()), unseeded: uIn.map(e => e.value.trim()), stage: tStage.value };
  store.set('losowanie.cfg', cfg);
  Sound.init();
  startDraw(cfg);
});

/* ================== LOSOWANIE ================== */
const $ = id => document.getElementById(id);
const setupSec = $('setup'), drawSec = $('draw');
const pairsBox = $('pairs'), chipsBox = $('chips'), reel = $('reel'), orb = $('orb'), drawBtn = $('drawBtn');
const finale = $('finale');
let S = null;

function startDraw(cfg){
  S = { cfg, pool: cfg.unseeded.map(n => ({ name: n, drawn: false, pair: null })), result: [null,null,null,null], next: 0, busy: false };
  $('drawStage').textContent = cfg.stage;
  $('bracketTitle').textContent = 'Drabinka · ' + cfg.stage;
  document.title = 'ARRMY CUP 2026 · Losowanie: ' + cfg.stage;
  // pary
  pairsBox.innerHTML = '';
  cfg.seeds.forEach((s, i)=>{
    const el = document.createElement('div'); el.className = 'pair'; el.id = 'pair' + i;
    el.innerHTML = '<div class="pno"><span>Para ' + (i + 1) + '</span><span class="st">oczekuje</span></div>' +
      '<div class="row"><div class="team seed"><small>Koszyk 1 · rozstawiona</small><div class="nm"></div></div>' +
      '<div class="vs"><span>VS</span></div>' +
      '<div class="team slot" id="slot' + i + '"><small>Koszyk 2</small><div class="nm">?</div></div></div>';
    el.querySelector('.seed .nm').textContent = s;
    pairsBox.appendChild(el);
  });
  renderPool();
  finale.classList.add('hidden'); finale.classList.remove('show');
  drawBtn.classList.remove('hidden'); drawBtn.disabled = false;
  reel.className = 'reel idle'; reel.textContent = '?'; fitReel();
  updateStatus();
  setupSec.classList.add('hidden'); drawSec.classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPool(){
  chipsBox.innerHTML = '';
  S.pool.forEach((t, i)=>{
    const c = document.createElement('div'); c.className = 'chip' + (t.drawn ? ' drawn' : ''); c.id = 'chip' + i;
    c.innerHTML = '<small>' + (t.drawn ? '→ Para ' + (t.pair + 1) : 'W koszyku') + '</small><span></span>';
    c.querySelector('span').textContent = t.name;
    chipsBox.appendChild(c);
  });
  $('poolCount').textContent = S.pool.filter(t => !t.drawn).length;
}

function updateStatus(){
  document.querySelectorAll('.pair').forEach((p, i)=>{
    p.classList.toggle('active', i === S.next);
    p.classList.toggle('done', !!S.result[i]);
    p.querySelector('.st').textContent = S.result[i] ? 'wylosowana ✓' : (i === S.next ? 'teraz losujemy' : 'oczekuje');
  });
  [...$('dots').children].forEach((d, i)=> d.classList.toggle('on', i < S.next));
  $('progressTxt').textContent = 'Wylosowano ' + S.next + ' / 4';
  if (S.next < 4){
    $('targetK').textContent = 'Rywal dla drużyny z pary ' + (S.next + 1);
    $('targetV').textContent = S.cfg.seeds[S.next];
    const left = 4 - S.next;
    drawBtn.textContent = left === 1 ? 'Losuj ostatnią drużynę' : 'Losuj kolejną drużynę';
  } else {
    $('targetK').textContent = 'Ceremonia zakończona';
    $('targetV').textContent = 'Wszystkie pary wyłonione';
  }
}

function fitReel(){
  const len = reel.textContent.length;
  if (reel.classList.contains('idle')) { reel.style.fontSize = ''; return; }
  const base = Math.min(300, window.innerWidth * .72) / 300;
  const size = len <= 8 ? 46 : len <= 12 ? 38 : len <= 16 ? 32 : len <= 22 ? 26 : 21;
  reel.style.fontSize = Math.round(size * Math.max(base, .7)) + 'px';
}

function setReel(text, cls){
  reel.className = 'reel';
  reel.textContent = text; fitReel();
  void reel.offsetWidth;
  if (cls) reel.classList.add(cls);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* animacja „maszyny”: szybkie miganie nazw, które stopniowo zwalnia (~2,8 s) */
async function spin(names, winner){
  const TOTAL = 2800, delays = [];
  let sum = 0;
  while (true){
    const p = sum / TOTAL;
    const d = 45 + 360 * Math.pow(p, 2.4);
    if (sum + d > TOTAL) break;
    delays.push(d); sum += d;
  }
  // sekwencja nazw – ostatnia to zwycięzca
  const seq = []; let prev = null;
  const single = names.length === 1;
  for (let i = 0; i < delays.length; i++){
    if (single){ seq.push(i % 2 ? names[0] : '? ? ?'); continue; }
    let n; do { n = names[randInt(names.length)]; } while (n === prev);
    seq.push(n); prev = n;
  }
  seq[seq.length - 1] = winner;
  if (!single && seq.length > 1 && seq[seq.length - 2] === winner){
    const others = names.filter(n => n !== winner);
    seq[seq.length - 2] = others[randInt(others.length)];
  }
  orb.classList.add('spinning');
  for (let i = 0; i < seq.length; i++){
    const p = i / (seq.length - 1);
    setReel(seq[i], 'tick');
    Sound.tick(p);
    const idx = S.pool.findIndex(t => t.name === seq[i] && !t.drawn);
    if (idx > -1){ const ch = $('chip' + idx); ch.classList.remove('flicker'); void ch.offsetWidth; ch.classList.add('flicker'); }
    await sleep(delays[i]);
  }
  orb.classList.remove('spinning');
}

async function drawNext(){
  if (!S || S.busy || S.next >= 4) return;
  S.busy = true; drawBtn.disabled = true; $('backBtn').disabled = true;
  Sound.init();
  const remaining = S.pool.filter(t => !t.drawn);
  const winner = shuffle(remaining)[0];               // Fisher–Yates na pozostałej puli
  const slotIdx = S.next;

  await spin(remaining.map(t => t.name), winner.name);

  // odsłonięcie
  setReel(winner.name, 'final');
  orb.classList.remove('hit'); void orb.offsetWidth; orb.classList.add('hit');
  await sleep(250);

  const slot = $('slot' + slotIdx), pair = $('pair' + slotIdx);
  slot.querySelector('.nm').textContent = winner.name;
  slot.classList.add('filled'); slot.classList.remove('reveal'); void slot.offsetWidth; slot.classList.add('reveal');
  pair.classList.remove('hit'); void pair.offsetWidth; pair.classList.add('hit');
  pair.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const r = slot.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  flashAt(x, y);
  FX.burst(x, y, 110, 9);
  const o = orb.getBoundingClientRect();
  FX.burst(o.left + o.width / 2, o.top + o.height / 2, 50, 7);
  Sound.gong(false);

  winner.drawn = true; winner.pair = slotIdx;
  S.result[slotIdx] = winner.name;
  S.next++;
  renderPool();
  updateStatus();

  await sleep(900);
  S.busy = false; $('backBtn').disabled = false;
  if (S.next >= 4) finish();
  else drawBtn.disabled = false;
}

function finish(){
  drawBtn.classList.add('hidden');
  finale.classList.remove('hidden'); void finale.offsetWidth; finale.classList.add('show');
  Sound.gong(true);
  const W = innerWidth;
  FX.burst(W * .2, innerHeight * .35, 120, 11);
  setTimeout(()=> FX.burst(W * .8, innerHeight * .35, 120, 11), 250);
  setTimeout(()=> FX.burst(W * .5, innerHeight * .25, 160, 13), 500);
  if (window.innerWidth <= 920) finale.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

drawBtn.addEventListener('click', drawNext);
$('redrawBtn').addEventListener('click', ()=> startDraw(S.cfg));
function backToSetup(){ if (S && S.busy) return; drawSec.classList.add('hidden'); setupSec.classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
$('editBtn').addEventListener('click', backToSetup);
$('backBtn').addEventListener('click', backToSetup);

document.addEventListener('keydown', e=>{
  if (drawSec.classList.contains('hidden')) return;
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  if (e.code === 'Space' || e.key === ' '){ e.preventDefault(); if (!drawBtn.classList.contains('hidden')) drawNext(); }
});
addEventListener('resize', ()=> { if (!reel.classList.contains('idle')) fitReel(); });
})();
</script>
